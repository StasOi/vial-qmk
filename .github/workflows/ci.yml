name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions: {}

jobs:
  check-uid:
    name: Check Vial UIDs
    runs-on: ubuntu-latest

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Verify Vial UID is unique per-keyboard
      run: python3 util/ci_vial_verify_uid.py

  build-vial:
    name: Build Vial keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07 
    env:
      KEYMAP: vial

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build
      id: build
      run: qmk compile -kb crkbd/rev4_0/standard/rp2040 -km vial
     
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cornev4-vial-firmware
        path: .build/*.uf2
